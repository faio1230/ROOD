name: Windows source build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-build.yml
      - CMakeLists.txt
      - CMakePresets.json
      - vcpkg.json
      - apps/**
      - include/**
      - src/**
      - tests/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      ROOD_VCPKG_SOURCE_BUILD: '1'
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pin CMake 3.31.6
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed.' }
          $version = & cmake --version | Select-Object -First 1
          if ($version -ne 'cmake version 3.31.6') { throw "Unexpected CMake: $version" }
      - name: Bootstrap Qt 6 Widgets
        shell: pwsh
        run: ./scripts/bootstrap-qt.ps1
      - name: Bootstrap PortAudio
        shell: cmd
        run: scripts\bootstrap-portaudio-msvc.cmd
      - name: Bootstrap Spout2
        shell: cmd
        run: scripts\bootstrap-spout2.cmd
      - name: Bootstrap OMT
        shell: pwsh
        run: ./scripts/bootstrap-omt.ps1
      - name: Build FFmpeg and libsrt from pinned source
        shell: cmd
        run: scripts\bootstrap-media-deps.cmd
      - name: Build ROOD and run CTest
        shell: cmd
        run: scripts\build-media-release-msvc.cmd
      - name: Verify linked media licenses and symbols
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $bins = @(
            'build/deps/vcpkg-installed/x64-windows/bin'
            'build/deps/portaudio-msvc-install/bin'
            'build/deps/spout2-msvc-install/bin'
            'build/deps/omt-v1.0.0.16/Libraries/Winx64'
          ) | ForEach-Object { Join-Path $root $_ }
          $env:PATH = ($bins -join ';') + ';' + $env:PATH
          $output = & ./build/msvc-media-release/rood_deps_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Media dependency verification failed.' }
          $output | Where-Object { $_ -notmatch '^FFmpeg configuration:' }
      - name: Fetch pinned Qt source and license texts
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/bootstrap-qt-source.ps1
      - name: Stage and smoke-test Windows package
        shell: pwsh
        timeout-minutes: 20
        run: |
          ./scripts/stage-windows-release.ps1
          $stage = Get-ChildItem build/stage -Directory -Filter 'ROOD-Windows-x64-*' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $stage) { throw 'Staged folder was not created.' }
          $manifest = Get-Content (Join-Path $stage.FullName 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.publishable -or $manifest.gitDirty -or
              $manifest.localUserProfilePathFileCount -ne 0 -or
              $manifest.credentialPatternFileCount -ne 0) {
            throw 'Staged release audit did not pass.'
          }
          Write-Host "Staged $(@($manifest.files).Count) files; local profile paths and credential patterns: 0."
      - name: Fetch pinned FFmpeg test sender
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/bootstrap-ffmpeg-test-cli.ps1
      - name: SRT decode and 32-channel OMT loopback
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            ./scripts/test-srt-loopback.ps1 `
              -FfmpegPath ./build/deps/ffmpeg-test-cli/ffmpeg.exe `
              -ReceiverExe ./build/msvc-media-release/rood_ingest.exe `
              -OmtName ROOD-CI-OMT32 -OmtChannels 32 `
              -OmtRoutes @('257:0:0','258:5:31') `
              -OmtSignalChannels '0,31' -LogName ci-srt-omt32
            Get-Content build/tests/ci-srt-omt32/omt-probe.stdout.txt |
              Select-String '^omtProbe signalChannelSums='
          } catch {
            Get-Content build/tests/ci-srt-omt32/receiver.stderr.txt -ErrorAction SilentlyContinue |
              Select-Object -Last 30
            Get-Content build/tests/ci-srt-omt32/omt-probe.stderr.txt -ErrorAction SilentlyContinue |
              Select-Object -Last 30
            throw
          }
